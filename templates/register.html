{% extends 'base.html' %}

{% block content %}
<article style="max-width: 600px; margin: 2rem auto; background-color: #141e30; border: 1px solid #2d3748;">
    <header style="text-align: center; border-bottom: 1px solid #2d3748;">
        <h2 style="margin-bottom: 0;">Creează un cont nou 🎯</h2>
        <p style="color: #a0aec0; font-size: 14px;">Alătură-te comunității HobbyPall</p>
    </header>

    <form action="{{ url_for('register') }}" method="POST">
        <div class="grid">
            <label for="nume" style="color: #cbd5e0;">
                Nume
                <input type="text" id="nume" name="nume" placeholder="Popescu" required style="background-color: #1a202c; border-color: #2d3748;">
            </label>
            <label for="prenume" style="color: #cbd5e0;">
                Prenume
                <input type="text" id="prenume" name="prenume" placeholder="Ion" required style="background-color: #1a202c; border-color: #2d3748;">
            </label>
        </div>

        <label for="username" style="color: #cbd5e0;">
            Nume utilizator (Username)
            <input type="text" id="username" name="username" placeholder="ion_popescu" required style="background-color: #1a202c; border-color: #2d3748;">
        </label>

        <label for="email" style="color: #cbd5e0;">
            Adresă de email
            <input type="email" id="email" name="email" placeholder="nume@exemplu.com" required style="background-color: #1a202c; border-color: #2d3748;">
        </label>

        <label for="parola" style="color: #cbd5e0;">
            Parolă
            <input type="password" id="parola" name="parola" placeholder="••••••••" required style="background-color: #1a202c; border-color: #2d3748;">
        </label>

        <label style="color: #a0aec0; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <input type="checkbox" id="show_password_register" onclick="togglePassword('parola')">
            Arată parola
        </label>

        <div class="grid">
            <label for="varsta" style="color: #cbd5e0;">
                Vârstă
                <input type="number" id="varsta" name="varsta" min="14" max="100" placeholder="18" required style="background-color: #1a202c; border-color: #2d3748;">
            </label>

            <label for="sex" style="color: #cbd5e0;">
                Gen (Sex)
                <select id="sex" name="sex" required style="background-color: #1a202c; border-color: #2d3748;">
                    <option value="" disabled selected>Alege...</option>
                    <option value="M">Masculin</option>
                    <option value="F">Feminin</option>
                    <option value="Altul">Altul</option>
                </select>
            </label>
        </div>

        <button type="submit" class="contrast" style="margin-top: 1rem;">Înregistrare</button>
    </form>

    <footer style="border-top: 1px solid #2d3748; padding-top: 1rem;">
        <p style="text-align: center; margin-bottom: 0; font-size: 14px;">
            Ai deja un cont? <a href="{{ url_for('login') }}">Autentifică-te aici</a>
        </p>
    </footer>
</article>
{% endblock %}
