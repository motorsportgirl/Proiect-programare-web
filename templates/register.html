{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 3rem;">
    <article style="padding: 3rem !important; border-top: 6px solid #f59e0b;">
        <header style="text-align: center; margin-bottom: 2rem;">
            <h2 style="margin-bottom: 0.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Creează un cont</h2>
            <p style="color: var(--muted-color);">Alătură-te comunității HobbyPall</p>
        </header>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="grid">
                <div style="margin-bottom: 1rem;">
                    <label style="font-weight: 600; font-size: 14px;">Prenume</label>
                    <input type="text" name="prenume" placeholder="Ion" required style="border-radius: 10px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="font-weight: 600; font-size: 14px;">Nume</label>
                    <input type="text" name="nume" placeholder="Popescu" required style="border-radius: 10px;">
                </div>
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="font-weight: 600; font-size: 14px;">Username</label>
                <input type="text" name="username" placeholder="ionp123" required style="border-radius: 10px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="font-weight: 600; font-size: 14px;">Email</label>
                <input type="email" name="email" placeholder="ion@exemplu.com" required style="border-radius: 10px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="font-weight: 600; font-size: 14px;">Parolă</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" name="parola" id="parola_reg" placeholder="••••••••" required style="border-radius: 10px; padding-right: 3.5rem; margin-bottom: 0;">
                    <span onclick="togglePassword('parola_reg')" style="position: absolute; right: 1rem; cursor: pointer; opacity: 0.6; font-size: 1.2rem; user-select: none;">👁️</span>
                </div>
            </div>

            <div class="grid">
                <div style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; font-size: 14px;">Vârstă</label>
                    <input type="number" name="varsta" min="14" value="18" required style="border-radius: 10px;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; font-size: 14px;">Gen</label>
                    <select name="sex" style="border-radius: 10px;">
                        <option value="M">Masculin</option>
                        <option value="F">Feminin</option>
                        <option value="Altu">Altul</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="primary" style="width: 100%; padding: 0.8rem;">Creează contul</button>
        </form>

        <footer style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <p style="font-size: 14px; color: var(--muted-color); margin-bottom: 0;">
                Ai deja cont? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700;">Autentifică-te</a>
            </p>
        </footer>
    </article>
</div>
{% endblock %}
