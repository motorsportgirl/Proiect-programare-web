{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 5rem;">
    <article style="padding: 3rem !important; border-top: 6px solid var(--primary);">
        <header style="text-align: center; margin-bottom: 2rem;">
            <h2 style="margin-bottom: 0.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Bine ai revenit!</h2>
            <p style="color: var(--muted-color);">Accesează-ți contul HobbyPall</p>
        </header>

        <form action="{{ url_for('login') }}" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="font-weight: 600; font-size: 14px;">Email sau username</label>
                <input type="text" name="email" placeholder="ex: ionp" required style="border-radius: 10px;">
            </div>

            <div style="margin-bottom: 2rem;">
                <label style="font-weight: 600; font-size: 14px;">Parolă</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" name="parola" id="parola" placeholder="••••••••" required style="border-radius: 10px; padding-right: 3.5rem; margin-bottom: 0;">
                    <span onclick="togglePassword('parola')" style="position: absolute; right: 1rem; cursor: pointer; opacity: 0.6; font-size: 1.2rem; user-select: none;">👁️</span>
                </div>
                <div style="text-align: right; margin-top: 0.5rem;">
                    <a href="{{ url_for('recuperare_parola') }}" style="font-size: 13px; color: var(--muted-color);">Ai uitat parola?</a>
                </div>
            </div>

            <button type="submit" class="primary" style="width: 100%; padding: 0.8rem;">Autentificare</button>
        </form>

        <footer style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <p style="font-size: 14px; color: var(--muted-color); margin-bottom: 0;">
                Nu ai cont? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700;">Înregistrează-te</a>
            </p>
        </footer>
    </article>
</div>
{% endblock %}
