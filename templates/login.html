{% extends 'base.html' %}

{% block content %}
<article style="max-width: 450px; margin: 4rem auto; background-color: #141e30; border: 1px solid #2d3748;">
    <header style="text-align: center; border-bottom: 1px solid #2d3748;">
        <h2 style="margin-bottom: 0;">Autentificare Cont 🔐</h2>
        <p style="color: #a0aec0; font-size: 14px;">Introdu datele tale pentru a continua</p>
    </header>

    <form action="{{ url_for('login') }}" method="POST">
        <label for="email" style="color: #cbd5e0;">
            Adresă de email / Username
            <input type="text" id="email" name="email" placeholder="ion_popescu sau email@exemplu.com" required style="background-color: #1a202c; border-color: #2d3748;">
        </label>

        <label for="parola" style="color: #cbd5e0;">
            Parolă
            <input type="password" id="parola" name="parola" placeholder="••••••••" required style="background-color: #1a202c; border-color: #2d3748;">
        </label>

        <div style="text-align: right; margin-top: -0.5rem; margin-bottom: 1.5rem;">
            <a href="{{ url_for('recuperare_parola') }}" style="font-size: 14px; color: #a0aec0;">Mi-am uitat parola</a>
        </div>

        <button type="submit" style="margin-top: 1rem;">Conectare</button>
    </form>

    <footer style="border-top: 1px solid #2d3748; padding-top: 1rem;">
        <p style="text-align: center; margin-bottom: 0; font-size: 14px;">
            Nu ai un cont încă? <a href="{{ url_for('register') }}">Creează unul acum</a>
        </p>
    </footer>
</article>
{% endblock %}
