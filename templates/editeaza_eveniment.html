{% extends 'base.html' %}

{% block content %}
<article style="max-width: 700px; margin: 2rem auto;">
    <header>
        <h2 style="text-align: center; margin-bottom: 0;">Editează evenimentul 📝</h2>
        <p style="text-align: center; color: gray;">Actualizează detaliile evenimentului tău</p>
    </header>

    <form action="{{ url_for('editeaza_eveniment', id_eveniment=eveniment.id_eveniment) }}" method="POST" enctype="multipart/form-data">
        <label for="titlu">
            Titlul evenimentului
            <input type="text" id="titlu" name="titlu" placeholder="ex: Meci amator de baschet 3v3" required value="{{ eveniment.titlu }}">
        </label>

        <label for="descriere">
            Descriere
            <textarea id="descriere" name="descriere" rows="4" placeholder="Detalii despre activitate, ce trebuie să aducă participanții etc." required>{{ eveniment.descriere }}</textarea>
        </label>

        <div class="grid">
            <label for="tip">
                Tipul evenimentului
                <select id="tip" name="tip" required>
                    {% for tip in event_types %}
                        <option value="{{ tip }}" {% if eveniment.tip == tip %}selected{% endif %}>{{ tip }}</option>
                    {% endfor %}
                    {% if eveniment.tip not in event_types %}
                        <option value="{{ eveniment.tip }}" selected>{{ eveniment.tip }}</option>
                    {% endif %}
                </select>
            </label>

            <label for="locatie">
                Locație / Link
                <input type="text" id="locatie" name="locatie" placeholder="ex: Parcul Herăstrău SAU link Google Meet" required value="{{ eveniment.locatie }}">
            </label>
        </div>

        <div class="grid">
            <label for="data_ora">
                Data și ora începerii
                <input type="datetime-local" id="data_ora" name="data_ora" required value="{{ eveniment.data_ora }}">
            </label>

            <label for="durata_minute">
                Durata (în minute)
                <input type="number" id="durata_minute" name="durata_minute" min="15" placeholder="90" required value="{{ eveniment.durata_minute }}">
            </label>
        </div>

        <label for="data_limita_inscriere">
            Data limită pentru înscrieri
            <input type="datetime-local" id="data_limita_inscriere" name="data_limita_inscriere" required value="{{ eveniment.data_limita_inscriere }}">
        </label>

        <label for="imagine">
            Imagine eveniment (opțional)
            <input type="file" id="imagine" name="imagine" accept="image/*">
            <small style="color: #a0aec0;">Lasă gol pentru a păstra imaginea curentă. Încarcă una nouă pentru a o schimba.</small>
        </label>

        <label for="nr_maxim_participanti">
            Număr maxim de participanți (opțional)
            <input type="number" id="nr_maxim_participanti" name="nr_maxim_participanti" min="1" placeholder="Lasă gol pentru locuri nelimitate" value="{{ eveniment.nr_maxim_participanti or '' }}">
        </label>

        <div class="grid">
            <label for="varsta_min">
                Vârstă minimă (opțional)
                <input type="number" id="varsta_min" name="varsta_min" min="0" placeholder="Fără limită" value="{{ eveniment.varsta_min or '' }}">
            </label>

            <label for="varsta_max">
                Vârstă maximă (opțional)
                <input type="number" id="varsta_max" name="varsta_max" min="0" placeholder="Fără limită" value="{{ eveniment.varsta_max or '' }}">
            </label>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button type="submit" class="secondary">Salvează modificările</button>
            <a href="{{ url_for('detalii_eveniment', id_eveniment=eveniment.id_eveniment) }}" role="button" class="outline">Anulează</a>
        </div>
    </form>

    <section style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
        <h4 style="color: #ef4444; margin-bottom: 0.35rem;">Ștergere eveniment</h4>
        <p style="color: var(--muted-color); font-size: 14px; margin-bottom: 1rem;">
            Șterge definitiv evenimentul, împreună cu înscrierile, întrebările și recenziile asociate.
        </p>
        <form action="{{ url_for('sterge_eveniment', id_eveniment=eveniment.id_eveniment) }}" method="POST">
            <button type="submit" class="profile-action-button danger" style="width: 100%;">Șterge definitiv evenimentul</button>
        </form>
    </section>
</article>
{% endblock %}
